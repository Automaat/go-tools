name: Fork IR lift benchmark

on:
  push:
    branches:
      - "experiment/ir-lift-*"

permissions: {}

jobs:
  benchmark:
    if: github.repository == 'Automaat/go-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: golang:1.26
      options: --cpus 2 --memory 1g --memory-swap 1g
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Benchmark single-block lifting
        run: >-
          go test ./go/ir
          -run '^$'
          -bench '^BenchmarkSSASingleBlockLocals$'
          -benchmem
          -benchtime=200ms
          -count=7
          -timeout=10m
      - name: Benchmark standard-library IR
        run: >-
          go test ./go/ir
          -run '^$'
          -bench '^BenchmarkSSA$'
          -benchmem
          -benchtime=1x
          -count=5
          -timeout=10m
